<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Instant Website Scanner — LegacyRefactor.ai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root {
    --mint: #00c776;
    --mint-dark: #00a45f;
    --bg-dark: #0d0d0d;
    --card-dark: #1a1a1a;
    --text-light: #e8e8e8;
  }

  body {
    background: var(--bg-dark);
    color: var(--text-light);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
  }

  h1 {
    font-size: 44px;
    margin-top: 80px;
    margin-bottom: 12px;
    color: var(--mint);
    font-weight: bold;
    animation: fadeIn 1s ease-out;
  }

  .subtitle {
    font-size: 18px;
    max-width: 700px;
    margin: 0 auto 50px;
    color: #bbbbbb;
    line-height: 1.5;
    animation: fadeIn 1.4s ease-out;
  }

  .scanner-box {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
    animation: fadeIn 1.2s ease-out;
  }

  input {
    width: 500px;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111;
    color: white;
    font-size: 17px;
    outline: none;
  }

  button {
    padding: 16px 28px;
    background: var(--mint);
    border: none;
    border-radius: 8px;
    color: black;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button:hover {
    background: var(--mint-dark);
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }

  /* RESULT CARD */
  .results {
    max-width: 850px;
    margin: 0 auto;
    background: var(--card-dark);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    text-align: left;
    display: none;
    animation: fadeIn 0.8s ease-out;
  }

  .results h2 {
    color: var(--mint);
    margin-top: 0;
    font-size: 26px;
  }

  .badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-right: 8px;
    margin-bottom: 8px;
  }

  .ok { background: #0c7; color: #000; }
  .warn { background: #f7b400; color: black; }
  .bad { background: #ff4e4e; color: white; }

  footer {
    margin-top: 70px;
    padding: 20px;
    font-size: 14px;
    color: #777;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
    .result-box {
      background: #111;
      border: 1px solid #00c776;
      padding: 20px;
      border-radius: 10px;
      margin-top: 25px;
      text-align: left;
      color: #eee;
    }

    .result-box.error {
      border-color: red;
      color: #ffb3b3;
    }

    #loading {
      display: none;
      margin-top: 20px;
      color: #00c776;
      font-size: 18px;
    }
</style>
</head>

<body>

<h1>Instant Website Scanner</h1>

<div class="subtitle">
  Paste any URL and instantly check SSL status, SEO basics, mobile-friendliness, metadata,
  and overall modern design signals. Lightweight, instant, and completely free.
</div>

<div class="scanner-box">
  <input id="urlInput" placeholder="https://example.com" />
  <button onclick="runScan()">Scan</button>
      

</div>

<div id="loading">Scanning…</div>
<div id="results" class="results"></div>

<footer>
  Website Scanner © LegacyRefactor.ai
</footer>

<script>
async function runScan() {
  const input = document.getElementById("urlInput");
  const url = input.value.trim();
  const output = document.getElementById("results");
  const spinner = document.getElementById("loading");

  output.innerHTML = "";
  spinner.style.display = "block";

  try {
    const response = await fetch("https://legacyrefactor-worker.lumpier-redbuds4p.workers.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    spinner.style.display = "none";

    if (data.error) {
      output.innerHTML = `
        <div class="result-box error">
          <strong>Error:</strong> ${data.error}
        </div>
      `;
      return;
    }

    // Format results nicely
    output.innerHTML = `
      <div class="result-box">
        <h3>Scan Results</h3>
        <p><strong>SSL:</strong> ${data.ssl ? "Valid ✓" : "Invalid ✗"}</p>
        <p><strong>Mobile Friendly:</strong> ${data.mobile ? "Yes ✓" : "No ✗"}</p>
        <p><strong>SEO Title:</strong> ${data.seoTitle || "Missing"}</p>
        <p><strong>Page Speed Score:</strong> ${data.performance || "N/A"}</p>
      </div>
    `;
  } catch (err) {
    spinner.style.display = "none";
    output.innerHTML = `
      <div class="result-box error">
        <strong>Unexpected Error:</strong> ${err.message}
      </div>
    `;
  }
}
</script>


</body>
</html>
