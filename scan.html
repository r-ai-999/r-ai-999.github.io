<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Instant Website Scanner — LegacyRefactor.ai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root {
    --mint: #00c776;
    --mint-dark: #00a45f;
    --bg-dark: #0d0d0d;
    --card-dark: #1a1a1a;
    --text-light: #e8e8e8;
  }

  body {
    background: var(--bg-dark);
    color: var(--text-light);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
  }

  h1 {
    font-size: 44px;
    margin-top: 80px;
    margin-bottom: 12px;
    color: var(--mint);
    font-weight: bold;
    animation: fadeIn 1s ease-out;
  }

  .subtitle {
    font-size: 18px;
    max-width: 700px;
    margin: 0 auto 50px;
    color: #bbbbbb;
    line-height: 1.5;
    animation: fadeIn 1.4s ease-out;
  }

  .scanner-box {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
    animation: fadeIn 1.2s ease-out;
  }

  input {
    width: 500px;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111;
    color: white;
    font-size: 17px;
    outline: none;
  }

  button {
    padding: 16px 28px;
    background: var(--mint);
    border: none;
    border-radius: 8px;
    color: black;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button:hover {
    background: var(--mint-dark);
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }

  /* RESULT CARD */
  .results {
    max-width: 850px;
    margin: 0 auto;
    background: var(--card-dark);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    text-align: left;
    display: none;
    animation: fadeIn 0.8s ease-out;
  }

  .results h2 {
    color: var(--mint);
    margin-top: 0;
    font-size: 26px;
  }

  .badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-right: 8px;
    margin-bottom: 8px;
  }

  .ok { background: #0c7; color: #000; }
  .warn { background: #f7b400; color: black; }
  .bad { background: #ff4e4e; color: white; }

  footer {
    margin-top: 70px;
    padding: 20px;
    font-size: 14px;
    color: #777;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<h1>Instant Website Scanner</h1>

<div class="subtitle">
  Paste any URL and instantly check SSL status, SEO basics, mobile-friendliness, metadata,
  and overall modern design signals. Lightweight, instant, and completely free.
</div>

<div class="scanner-box">
  <input id="urlInput" placeholder="https://example.com" />
  <button onclick="scanSite()">Scan</button>
</div>

<div id="results" class="results"></div>

<footer>
  Website Scanner © LegacyRefactor.ai
</footer>

<script>
async function scanSite() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return alert("Enter a URL");

  const r = document.getElementById("results");
  r.style.display = "block";
  r.innerHTML = "<p>Scanning...</p>";

  try {
    const api = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const response = await fetch(api);
    const data = await response.json();

    const html = data.contents || "";

    const sslOK = url.startsWith("https://");
    const titleOK = html.includes("<title>");
    const mobileOK = html.includes("viewport");
    const seoDescOK = html.includes("meta name=\"description\"");
    const modernOK = html.includes("display:flex") || html.includes("flex;");

    const badge = (ok) =>
      ok ? "<span class='badge ok'>OK</span>" : "<span class='badge bad'>Missing</span>";

    r.innerHTML = `
      <h2>Scan Results for ${url}</h2>

      <p><b>SSL:</b> ${badge(sslOK)}</p>
      <p><b>SEO Description:</b> ${badge(seoDescOK)}</p>
      <p><b>Mobile Responsive Tag:</b> ${badge(mobileOK)}</p>
      <p><b>Page Title:</b> ${badge(titleOK)}</p>
      <p><b>Modern Design Signals (flexbox/grid detected):</b> ${badge(modernOK)}</p>

      <br><br>
      <p style="color:#aaa;font-size:14px;">
        These are lightweight indicators — for full audits, check out “Modern Website Audit.”
      </p>
    `;
  } catch (e) {
    r.innerHTML = "<p style='color:red;'>Could not scan site.</p>";
  }
}
</script>

</body>
</html>
